<!doctype html><html lang="da"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Genretræning · Samfundsfag A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: arbejdsbord – bilag til venstre som papir, opgaven til højre som rettearket; én kolonne på telefon */
:root{
  --paper:#f3f5f2; --surface:#ffffff; --sheet:#fbfbf7; --ink:#18212c; --muted:#56616d; --line:#d6dcd6;
  --accent:#273266; --accent-ink:#ffffff; --accent-soft:#e7e9f3; --brand:#273266; --mark:#ffe47a; --b-udled:#4a6cf7; --b-hyp:#11b3d0; --b-und:#4cb050; --b-sam:#f2a516; --b-dis:#ef5b4c; --b-not:#b04fd0; --logo-bg:#1d2550;
  --ok:#1d7447; --ok-soft:#e2f2e8; --bad:#ad2a20; --bad-soft:#fbe8e5; --hint:#7d5200; --hint-soft:#fff1cf;
  --c1:#2343a8; --c2:#c2410c; --c3:#0f766e; --c4:#9333ea; --c5:#6b7280;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-doc:"Source Serif 4", Georgia, "Times New Roman", serif;
  --r:10px;
  --logo-paper:#ffffff; --logo-line:#2343a8; --logo-mark:#ffe066;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11151b; --surface:#19202a; --sheet:#1d232c; --ink:#e6eaef; --muted:#9ba6b2; --line:#2e3744;
  --accent:#b4bff0; --accent-ink:#10151f; --accent-soft:#232a45; --brand:#b4bff0; --mark:#5c4c10;
  --ok:#62d39a; --ok-soft:#133022; --bad:#ff8f84; --bad-soft:#3b1815; --hint:#f0c56a; --hint-soft:#33290f;
  --c1:#93a9ff; --c2:#fb923c; --c3:#2dd4bf; --c4:#c084fc; --c5:#9ca3af; --logo-paper:#eef2ff; --logo-line:#2343a8; --logo-mark:#ffd84a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11151b; --surface:#19202a; --sheet:#1d232c; --ink:#e6eaef; --muted:#9ba6b2; --line:#2e3744;
  --accent:#b4bff0; --accent-ink:#10151f; --accent-soft:#232a45; --brand:#b4bff0; --mark:#5c4c10;
  --ok:#62d39a; --ok-soft:#133022; --bad:#ff8f84; --bad-soft:#3b1815; --hint:#f0c56a; --hint-soft:#33290f;
  --c1:#93a9ff; --c2:#fb923c; --c3:#2dd4bf; --c4:#c084fc; --c5:#9ca3af; --logo-paper:#eef2ff; --logo-line:#2343a8; --logo-mark:#ffd84a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* Header + faner */
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding-block:22px 10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:.95rem}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:6px 12px;border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.95rem}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--accent)}

/* Genreoversigt */
.genre{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;padding-block:26px}
@media (max-width:860px){.genre{grid-template-columns:minmax(0,1fr)}}
.genre h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}
.genre .lead{max-width:60ch;margin:10px 0 18px}
.kravbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kravbox h3{font-size:1.05rem;margin-bottom:8px}
ol.krav{margin:0;padding-left:1.3em;display:grid;gap:6px}
ol.krav li::marker{font-weight:700;color:var(--accent)}
.omfang{margin-top:10px;font-size:.9rem}
.cards{display:grid;gap:12px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px}
.card.soon{background:transparent;border-style:dashed}
.card h3{font-size:1.2rem}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.88rem;color:var(--muted)}
.card .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.best{font-size:.88rem;color:var(--ok);font-weight:700}

/* Quiz-layout */
.quizbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:16px 6px}
.back{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0}
.quizbar h2{font-size:1.35rem}
.steps{display:flex;gap:4px;margin-left:auto}
.steps i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--ok)} .steps i.part{background:var(--hint)} .steps i.miss{background:var(--bad)} .steps i.now{background:var(--accent)}
.desk{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start;padding-block:10px}
@media (max-width:960px){.desk{grid-template-columns:minmax(0,1fr)}}
.bilagpane{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:14px;padding-right:2px}
@media (max-width:960px){.bilagpane{position:static;max-height:none;overflow:visible;order:2}.qpane{order:1}}
.tobilag{display:none;font-weight:700;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:inherit;letter-spacing:inherit;text-transform:inherit}
@media (max-width:960px){.tobilag{display:inline}}
details.bilag{min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 var(--line)}
details.bilag>summary{cursor:pointer;padding:12px 16px;font-family:var(--f-doc);font-weight:600;font-size:1rem;list-style:none;display:flex;gap:10px;align-items:baseline}
details.bilag>summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.bilag[open]>summary::before{transform:rotate(90deg)}
.bilagbody{padding:0 16px 16px;font-family:var(--f-doc);font-size:.98rem;min-width:0}
.bilagbody p{margin:.6em 0;max-width:68ch}
.byline{font-style:italic;color:var(--muted)}
.src{font-size:.85rem;color:var(--muted);margin-top:10px}
.note{font-size:.85rem;color:var(--muted);margin-top:8px}
.tablewrap{overflow-x:auto;margin-top:6px}
table.data{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem;min-width:100%}
table.data td:not(:first-child){white-space:nowrap}
table.data td:first-child{min-width:11em}
table.data th,table.data td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:bottom}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data thead th{font-weight:600;font-size:.82rem;border-bottom:2px solid var(--ink)}
table.data tr.grp td{font-weight:600;padding-top:10px;border-bottom:0}
table.data tr.total td{font-weight:600;border-top:1px solid var(--ink)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--ink);font-family:var(--f-body)}
svg.chart .axis{stroke:var(--muted)} svg.chart .grid{stroke:var(--line)}

.qpane{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.task{font-family:var(--f-doc);font-size:1.05rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:8px 0 4px}
.prompt{font-size:1.12rem;font-weight:700;margin:4px 0 12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-display);font-weight:800;color:var(--accent)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);cursor:default}
.opt.wrong .k{color:var(--bad)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{color:var(--ok)}
.opt:disabled:not(.wrong):not(.right){opacity:.75;cursor:default}
.fb{border-radius:8px;padding:10px 13px;font-size:.95rem}
.fb.bad{background:var(--bad-soft)} .fb.ok{background:var(--ok-soft)} .fb.hint{background:var(--hint-soft)}
.fb b.t{display:block;margin-bottom:2px}
.fb.bad b.t{color:var(--bad)} .fb.ok b.t{color:var(--ok)} .fb.hint b.t{color:var(--hint)}
.others{margin-top:8px;display:grid;gap:6px;font-size:.92rem}
.others div{padding-left:12px;border-left:2px solid var(--line)}
.kravchip{display:inline-flex;gap:6px;align-items:baseline;font-size:.88rem;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:6px 10px}
.kravchip b{color:var(--accent)}
.numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.numrow input{font:inherit;font-variant-numeric:tabular-nums;width:9em;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.feedstack{display:grid;gap:8px;margin-top:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:12px}
label.f{display:grid;gap:4px;font-weight:700;margin-top:14px}
label.f input{font:inherit;font-weight:400;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);max-width:22em}

/* Resultat */
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.score .big{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
ul.status{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
ul.status li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
ul.status .ic{font-weight:800;text-align:center}
ul.status .first .ic{color:var(--ok)} ul.status .hints .ic{color:var(--hint)} ul.status .missed .ic{color:var(--bad)} ul.status .none{color:var(--muted)}
pre.receipt{font-family:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;font-size:.9rem;background:var(--sheet);border:1px dashed var(--muted);border-radius:6px;padding:14px;white-space:pre-wrap;margin:8px 0 0;user-select:all}

/* Kode */
.gate{max-width:440px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.gate h1{font-size:1.7rem;margin-bottom:6px}
.gate input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%;margin:12px 0}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}

/* Site-header og navigation */
.site{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.logo svg{width:34px;height:34px;flex:0 0 auto}
.logo .word{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.015em}
.logo .word small{display:block;font-family:var(--f-body);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:-2px}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main button{background:none;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;color:var(--muted)}
nav.main button:hover{color:var(--ink);background:var(--surface)}
nav.main button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs{border-bottom:0;padding-block:14px 0}
mark.hl{background:linear-gradient(transparent 52%, var(--mark) 52%, var(--mark) 92%, transparent 92%);color:inherit;padding:0 .08em}

/* Forside */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:48px 36px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:32px 24px}}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.7rem);font-weight:800;letter-spacing:-.025em;line-height:1.04}
.hero .lead{font-size:1.12rem;max-width:52ch;margin:18px 0 22px;color:var(--muted)}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.btn.lg{padding:13px 20px;font-size:1.02rem}
.decode{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:22px 22px 18px;box-shadow:0 18px 40px -28px rgba(20,30,60,.45);position:relative}
.decode .label{margin-bottom:10px}
.decode p{font-family:var(--f-doc);font-size:1.12rem;line-height:1.6;margin:0}
.decode sup{font-family:var(--f-body);font-weight:800;color:var(--accent);font-size:.72rem;margin-left:1px}
.decode ol{margin:16px 0 0;padding:14px 0 0 1.2em;border-top:1px dashed var(--line);display:grid;gap:6px;font-size:.93rem}
.decode ol li::marker{font-weight:800;color:var(--accent)}
.quote{font-family:var(--f-doc);font-style:italic;color:var(--muted);font-size:.95rem;margin-top:14px;max-width:60ch}
section.block{padding-block:26px}
section.block>h2{font-size:clamp(1.4rem,2.6vw,1.9rem);margin-bottom:6px}
section.block>.sub{margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:1.2rem}
.tile .n{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:.95rem}
.tile p{margin:0;color:var(--muted);font-size:.95rem}
.tile .meta{font-size:.85rem;color:var(--muted);margin-top:4px}
.wide{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--accent-soft);border-color:transparent}
@media (max-width:560px){.wide{grid-template-columns:minmax(0,1fr)}}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:s}
@media (max-width:760px){.howto{grid-template-columns:minmax(0,1fr)}}
.howto div{border-top:3px solid var(--accent);padding-top:12px}
.howto h3{font-size:1.1rem;margin-bottom:4px}
.howto h3::before{counter-increment:s;content:counter(s) ". ";color:var(--accent)}
.howto p{margin:0;color:var(--muted)}
.credit{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding-block:22px;border-top:1px solid var(--line);margin-top:20px}
.credit b{font-family:var(--f-display);font-size:1.05rem}

/* Om-side */
.prose{max-width:68ch;padding-block:30px}
.prose h1{font-size:clamp(1.9rem,4vw,2.6rem);margin-bottom:14px}
.prose h2{font-size:1.25rem;margin:26px 0 6px}
.prose p,.prose li{color:var(--ink)}
.prose ul{padding-left:1.2em}
.prose .ai{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px}

/* Begreber */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;cursor:pointer;font-size:.92rem}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lvcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.lvcards{grid-template-columns:minmax(0,1fr)}}
.clist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px;margin-top:10px}
@media (max-width:760px){.clist{grid-template-columns:minmax(0,1fr)}}
.clist dt{font-weight:700;font-family:var(--f-display)}
.clist dd{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.clist .disc{grid-column:1/-1;margin-top:12px}
.search{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;max-width:26em}
.desk.solo{grid-template-columns:minmax(0,820px)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer}



.fb.inl{margin:-2px 0 4px 38px}
@media (max-width:560px){.fb.inl{margin-left:12px}}
.clist .disc{display:none}
h3.disc{margin:18px 0 6px;font-family:var(--f-body)}
.clists{margin-top:6px}
@media (max-width:620px){ nav.main{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto} nav.main button{padding:7px 10px;flex:0 0 auto} }
/* Stort vindue */
.swipe{display:none;font-family:var(--f-body);font-size:.82rem;font-weight:700;color:var(--muted);margin-top:4px}
@media (max-width:700px){.swipe{display:block}}
.bigrow{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.bigbtn{font-family:var(--f-body);font-size:.85rem;font-weight:700;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.bigbtn:hover{border-color:var(--accent)}
html.noscroll,html.noscroll body{overflow:hidden}
.bigview{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto;
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:calc(32px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.bigbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line);padding-block:14px 12px;max-width:1240px;margin:0 auto}
.bigtitle{display:grid;gap:8px;min-width:0}
.bigtabs{display:flex;flex-wrap:wrap;gap:6px}

    "paras": [
     "Grundlaget for tværsnitsstudiet er fire gruppeinterview med i alt 12 unge i alderen 16-24 år. De unge er udvalgt ved, at de på interviewtidspunktet var aktive i et værested rettet mod at afhjælpe og lindre ensomhed. […] Kun enkelte af de unge er relativ tæt på uddannelse og beskæftigelse. […] Vi har altså en gruppe af unge, som har erkendt en følelse af ensomhed, og både har oplevet den stærk nok – og haft tilstrækkelige personlige ressourcer og/eller støttende personer omkring sig – til at handle aktivt på det.",

    "byline": "VIVE – Det Nationale Forsknings- og Analysecenter for Velfærd, 2024. Rapporten er bestilt og finansieret af Beskæftigelsesministeriet. Uddrag af hovedresultater.",
    "paras": [
     "For både unge og andre kan en førtidspension være relevant og nødvendig, men når en ung under 40 år tilkendes førtidspension, er der en risiko for, at den unge overlades til sig selv på en varig ydelse med et langt liv foran sig uden aktiv deltagelse i arbejds- og samfundslivet. […]",
     "Rapporten bygger på kvalitative interviews med sagsbehandlere og ledere i syv danske jobcentre, hvor der ligeledes er gennemgået sager, som er endt med en tilkendelse af førtidspension for en person under 40 år. Der er udelukkende interviewet fagpersoner – de unge indgår ikke selv i undersøgelsen. […]",
     "<b>Øget kompleksitet i udfordringer og øget afstand til arbejdsmarkedet:</b> Jobcentrene møder flere unge med komplekse, især psykiske udfordringer, som ofte ikke har nogen uddannelses- og/eller arbejdsmarkedserfaring. […]<br><b>Politiske signaler og mediehistorier:</b> De senere års politiske signaler, herunder reformer og lovændringer, og mediehistorier har gjort jobcentrene mere forsigtige med at presse borgerne, hvilket har ført til hurtigere afklaring af sager til førtidspension. […]",
     "Unge under 30 år visiteres som udgangspunkt til uddannelseshjælp og mødes med et uddannelsespålæg, når de henvender sig i jobcenteret, men de har ikke basale skolefærdigheder og er ikke motiveret for uddannelse. […]",
     "Det tværsektorielle samarbejde er udfordret af, at henholdsvis beskæftigelsesforvaltningen, socialforvaltningen og sundhedsforvaltningen i den enkelte kommune har eget lovgrundlag og eget budget, der ikke fremmer samarbejdet om den unge. Kommuner, der har organiseret sig med en ungeindsats, oplever, at denne organisering mindsker samarbejdsudfordringerne. […]",
     "<b>Opmærksomhedspunkter</b> […]<br>• Tidlig intervention og forebyggelse i grundskolen kan forhindre, at den unges problemer eskalerer og fører til alvorlige sociale og helbredsmæssige udfordringer senere i livet. […]<br>• Kortere ventetider i psykiatrien kan forbedre de unges helbred og øge deres muligheder for at komme i beskæftigelse eller uddannelse. […]<br>• Et mere rummeligt arbejdsmarked med plads til denne gruppe af unge vil kunne bidrage til succesfulde virksomhedspraktikker og eventuel beskæftigelse på sigt."

      {t:"Eksternalitet", ok:true, f:"Klimaskaden rammer andre end dem, der udleder, og indgår ikke i prisen. Afgiften skal få prisen til at afspejle skaden."},
      {t:"Inflation", f:"Afgiften kan påvirke priserne, men inflation er ikke begrundelsen for afgiften."},
      {t:"Finanspolitik", f:"En afgift er et finanspolitisk redskab, men begrundelsen i casen handler om, at skaden ikke indgår i prisen."},
      {t:"Humankapital", f:"Humankapital handler om arbejdsstyrkens kompetencer og har ikke noget med forurening at gøre."}],
    hints:["Begrundelsen handler om, hvem der betaler for skaden."]},
  { d:"oek", prompt:"Økonomien er i lavkonjunktur, og regeringen sætter flere offentlige byggeprojekter i gang for at skabe arbejdspladser. Hvilket begreb beskriver bedst regeringens indgreb?",
    options:[
      {t:"Finanspolitik", ok:true, f:"Regeringen bruger de offentlige udgifter til at øge den økonomiske aktivitet. Det er en lempelig (ekspansiv) finanspolitik."},
      {t:"Pengepolitik", f:"Pengepolitik føres af Nationalbanken gennem renten. Her bruger regeringen de offentlige udgifter."},
      {t:"Strukturel ledighed", f:"Byggeprojekterne skal modvirke ledighed, der skyldes lavkonjunkturen. Det er altså ikke strukturel ledighed, der bekæmpes."},
      {t:"Arbejdsudbud", f:"Indgrebet øger efterspørgslen efter arbejdskraft, ikke udbuddet."}],
    hints:["Hvem gennemfører indgrebet, og med hvilket redskab?"]},

  { d:"ip", prompt:"Efter at land A har øget sin militære aktivitet i et grænseområde, øger flere nabolande deres forsvarsbudgetter. Det bruger land A som begrundelse for at opruste yderligere. Hvilket begreb er mest anvendeligt til at forklare udviklingen?",
    options:[
      {t:"Sikkerhedsdilemma", ok:true, f:"Hver sides oprustning for egen sikkerhed opfattes som en trussel af den anden, og det fører til yderligere oprustning."},
      {t:"Blød magt", f:"Blød magt handler om tiltrækning gennem kultur og værdier. Her er der tale om militær oprustning."},
      {t:"Interdependens", f:"Interdependens handler om gensidig afhængighed, som kan dæmpe konflikter. Casen viser en spiral af oprustning."},
      {t:"Konstruktivisme", f:"Konstruktivismen kan bruges til at se på trusselsopfattelser, men begrebet, der præcist beskriver oprustningsspiralen, er sikkerhedsdilemmaet."}],
    hints:["Hvad sker der, når den ene sides forsvar opfattes som den anden sides trussel?"]},
  { d:"ip", prompt:"Danmark deltager aktivt i internationale militære missioner og bruger det til at få indflydelse i NATO og et tæt forhold til USA. Hvilket begreb beskriver bedst strategien?",
    options:[
      {t:"Aktivisme", ok:true, f:"Danmark forsøger aktivt at påvirke det internationale system og sin position i alliancen."},
      {t:"Tilpasningspolitik", f:"Tilpasning handler om at indrette sig efter omgivelserne. Her forsøger Danmark aktivt at få indflydelse."},
      {t:"Polaritet", f:"Polaritet beskriver magtfordelingen i hele systemet, ikke en stats strategi."},
      {t:"Anarki", f:"Anarki beskriver det internationale systems struktur, ikke Danmarks valg af strategi."}],
    hints:["Forholder Danmark sig passivt eller aktivt til omgivelserne?"]},
  { d:"ip", prompt:"Kina og USA er uenige om meget, men undgår at lade konflikten eskalere, fordi begge landes økonomier er tæt forbundet gennem handel. Hvilket begreb er mest anvendeligt til at forklare forsigtigheden?",
    options:[
      {t:"Interdependens", ok:true, f:"Den gensidige økonomiske afhængighed gør en eskalering dyr for begge parter."},
      {t:"Magtbalance", f:"Magtbalance handler om at alliere sig eller opruste mod en dominerende stat. Casen handler om økonomisk afhængighed."},
      {t:"Anarki", f:"Anarki forklarer snarere, hvorfor konflikter kan opstå. Det forklarer ikke forsigtigheden her."},
      {t:"Blød magt", f:"Blød magt handler om tiltrækning gennem kultur og værdier, ikke om handel som bremse på konflikter."}],
    hints:["Hvad ville begge lande miste ved en eskalering?"]}
];

</script>
<script>
(function(){
const ACCESS_CODE = "genre26";
const AUTHOR = "Bonnie Kjeldgaard-Christiansen";
const SCHOOL = "Haderslev Katedralskole";
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem("gt:"+k); return v==null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("gt:"+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n, d=1) => n.toLocaleString("da-DK",{minimumFractionDigits:d, maximumFractionDigits:d});
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* Begrebstræning som pseudo-genre */
const BEGREB = { id:"beg", tab:"Begreber", name:"Begrebstræning", omfang:"",
  krav:[
    ["def","Kend begrebets definition, så du kan bruge det præcist."],
    ["genkend","Genkend begrebet, når det beskrives med andre ord."],
    ["eksempel","Kobl begrebet til konkrete eksempler og situationer."],
    ["analyse","Vælg det begreb, der bedst forklarer et konkret mønster eller en case."]
  ]};
const BLEVELS = {1:"Niveau 1 · Begreb og definition", 2:"Niveau 2 · Begreb og eksempel", 3:"Niveau 3 · Begreber i analyse"};
const G = id => id==="beg" ? BEGREB : GENRES.find(g => g.id===id);
const kravText = (g, id) => (g.krav.find(k => k[0]===id)||["",""])[1];
const discName = id => id==="alle" ? "Alle discipliner" : DISCIPLINES.find(d=>d[0]===id)[1];
const levelLabel = q => q.genre==="beg" ? BLEVELS[q.level] : LEVELS[q.level];
/* Sorteringsopgaver (metodekort, find temaerne) bruger mc-motoren: kolonnerne er svarmulighederne */
QUIZZES.forEach(q => q.questions.forEach(x => { if(x.type==="sort"){
  x.sort = true; x.type = "mc";
  x.options = q.columns.map(c => ({ t:c.label, col:c.id, ok: c.id===x.col, f: c.id===x.col ? x.f : x.wf }));
  if(!x.prompt) x.prompt = q.sortPrompt || "Hvor hører kortet til?";
}}));

/* Hash-links: Bonnie kan linke direkte til en side, fx …#begreber */
const SLUG = {udled:"udled", hyp:"hypoteser", und:"undersoeg", sam:"sammenlign", dis:"diskuter", not:"notat"};
const UNSLUG = Object.fromEntries(Object.entries(SLUG).map(([k,v])=>[v,k]));

let unlocked = store.get("unlocked", false);
let state = { view:"home", genre:"udled", quiz:null, run:null, disc:"alle", search:"" };

function routeFromHash(){
  let h = ""; try{ h = (location.hash||"").replace(/^#/,""); }catch(e){}
  if(h==="om") state.view="om";
  else if(h==="begreber") state.view="begreber";
  else if(UNSLUG[h]){ state.view="genre"; state.genre=UNSLUG[h]; }
  else if(h==="" ) state.view="home";
  else return false;
  state.run=null; return true;
}
function setHash(token){ try{ history.replaceState(null, "", token ? "#"+token : location.pathname + location.search); }catch(e){} }
function go(view, genre){
  state.view = view; if(genre) state.genre = genre; state.run = null; state.armed = null;
  setHash(view==="home" ? "" : view==="genre" ? SLUG[state.genre] : view);
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => { if(routeFromHash()) { render(); window.scrollTo(0,0); } });

function render(){
  closeBig(true);
  const scoped = (state.view==="genre" || (state.view==="quiz" && state.genre!=="beg")) && state.genre!=="beg";
  if(scoped) app.dataset.g = state.genre; else delete app.dataset.g;
  if(!unlocked) return renderGate();
  ({home:renderHome, genre:renderGenre, quiz:renderQuiz, begreber:renderBegreber, om:renderOm}[state.view]||renderHome)();
}

/* ---------- Logo ---------- */
const GORDER = ["udled","hyp","und","sam","dis","not"];
function ringPaths(fill){
  const cx=17, cy=17, R=11.4, r=6.3, gap=0.12, P=(rad,a)=>(cx+rad*Math.cos(a)).toFixed(2)+" "+(cy+rad*Math.sin(a)).toFixed(2);
  return GORDER.map((id,i)=>{ const a1=Math.PI/180*(60*i-90)+gap, a2=Math.PI/180*(60*(i+1)-90)-gap;
    return `<path d="M${P(R,a1)}L${P(R,a2)}L${P(r,a2)}L${P(r,a1)}Z" ${fill(id)}/>`; }).join("");
}
function logoSvg(){
  return `<svg viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8.5" fill="var(--logo-bg)"/>${ringPaths(id=>`fill="var(--b-${id})"`)}</svg>`;
}
/* Genrens tegn: ringen med genrens eget felt fremhævet */
function glyph(gid){
  return `<svg class="glyph" viewBox="4 4 26 26" aria-hidden="true">${ringPaths(id=>id===gid?'class="on"':"")}</svg>`;
}

/* ---------- Kode ---------- */
function renderGate(){
  app.innerHTML = `<div class="gate">
    <div class="logo" style="cursor:default">${logoSvg()}<span class="word">Genretræning<small>Samfundsfag A</small></span></div>
    <p class="muted" style="margin-top:16px">Skriv den kode, du har fået af din lærer.</p>
    <form id="gf"><label class="label" for="code">Kode</label>
    <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="err" id="gerr" aria-live="polite"></div>
    <button class="btn" type="submit">Åbn</button></form>
    <p class="muted" style="font-size:.85rem;margin:18px 0 0">Udviklet af ${AUTHOR}, ${SCHOOL}.</p></div>`;
  $("#gf").addEventListener("submit", e => {
    e.preventDefault();
    if($("#code").value.trim().toLowerCase() === ACCESS_CODE){ unlocked = true; store.set("unlocked", true); render(); }
    else $("#gerr").textContent = "Koden passer ikke. Tjek stavningen, og prøv igen.";
  });
  $("#code").focus();
}

/* ---------- Header og footer ---------- */
function header(){
  const cur = state.view==="quiz" ? (state.genre==="beg" ? "begreber" : "genre") : state.view;
  const item = (v,l) => `<button data-nav="${v}" ${cur===v?'aria-current="page"':""}>${l}</button>`;
  const showTabs = state.view==="genre" || (state.view==="quiz" && state.genre!=="beg");
  return `<header class="site"><button class="logo" data-nav="home" aria-label="Til forsiden">${logoSvg()}<span class="word">Genretræning<small>Samfundsfag A</small></span></button>
    <nav class="main" aria-label="Hovedmenu">${item("home","Forside")}${item("genre","Genrer")}${item("begreber","Begreber")}${item("om","Om sitet")}</nav></header>
    ${showTabs ? `<nav class="tabs" role="tablist" aria-label="Genrer">${GENRES.map(g =>
      `<button role="tab" data-g="${g.id}" aria-selected="${state.genre===g.id && state.view==="genre"}"><span class="dot" aria-hidden="true"></span>${g.tab}</button>`).join("")}</nav>` : ""}`;
}
function footer(){
  return `<footer>Genretræning er udviklet af ${AUTHOR}, ${SCHOOL}. Bilagene er autentiske og stammer fra de angivne kilder. · <button class="linkbtn" data-nav="om">Om sitet</button></footer>`;
}
function inQuiz(){ return state.view==="quiz" && state.run && state.run.started && !state.run.finished; }
function guard(btn, fn){
  if(inQuiz() && state.armed!==btn){ state.armed = btn; btn.dataset.orig = btn.textContent; btn.textContent = "Forlad quizzen?"; return; }
  fn();
}
function bindChrome(){
  app.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => guard(b, () => go(b.dataset.nav))));
  app.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => guard(b, () => go("genre", b.dataset.g))));
  app.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => startQuiz(b.dataset.q)));
  app.querySelectorAll("[data-b]").forEach(b => b.addEventListener("click", () => { const [lv, d] = b.dataset.b.split(":"); startBegreb(+lv, d); }));
  app.querySelectorAll("[data-big]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); openBig(+b.dataset.big); }));
  app.querySelectorAll(".tobilag").forEach(b => b.addEventListener("click", () => { const el = $("#bilag"); if(el){ el.querySelectorAll("details").forEach(d=>d.open=true); el.scrollIntoView({block:"start"}); } }));
}

/* ---------- Forside ---------- */
function renderHome(){
  const results = store.get("results", {});
  const tiles = GENRES.map((g,i) => {
    const qs = QUIZZES.filter(q=>q.genre===g.id); const done = qs.filter(q=>results[q.id]).length;
    return `<button class="tile" data-nav-g="${g.id}" data-g="${g.id}"><span class="tilehead"><span class="n">${String(i+1).padStart(2,"0")}</span>${glyph(g.id)}</span><h3>${esc(g.name)}</h3><p>${esc(g.intro)}</p>
      <span class="meta">${qs.length} ${qs.length===1?"quiz":"quizzer"}${done?` · ${done} gennemført`:""}</span></button>`;
  }).join("");
  app.innerHTML = header() + `
  <section class="hero">
    <div><div class="label">Samfundsfag A · skriftlig prøve</div>
      <h1>Gør præcis det, opgaven <span class="six">beder om</span>.</h1>
      <p class="lead">Træn de seks opgavetyper med autentiske bilag. Vælg det bedste svar, få et hint, når du rammer forkert, og se til sidst, hvilke genrekrav du har styr på.</p>
      <div class="cta"><button class="btn lg" data-nav="genre">Træn en genre</button><button class="btn lg ghost" data-nav="begreber">Træn begreber</button></div>
      <p class="quote">”Det er et krav, at besvarelsen er fokuseret, dvs. at eleven i sin besvarelse gør præcis, som der bliver spurgt om.” Vejledning til samfundsfag A, 2024</p></div>
    <div class="decode" aria-label="Eksempel på en afkodet opgaveformulering">
      <div class="label">Eksempel · Sådan afkoder du en opgaveformulering</div>
      <p><mark class="hl">Diskutér</mark><sup>1</sup> fordele og ulemper ved regeringens nye ordning for international arbejdskraft. Diskussionen skal tage <mark class="hl">udgangspunkt i bilag 1</mark><sup>2</sup>, og du skal <mark class="hl">anvende viden om økonomiske mål</mark><sup>3</sup>.</p>
      <ol><li><b>Genren:</b> modstil argumenter for og imod. Et referat er ikke en diskussion.</li>
        <li><b>Udgangspunktet:</b> start i bilagets synspunkt, og brug det undervejs.</li>
        <li><b>Det faglige krav:</b> kobl argumenterne til fx vækst, inflation og fordeling.</li></ol>
    </div>
  </section>
  <section class="block"><h2>Vælg en opgavetype</h2><p class="sub muted">Hver genre har sine egne krav. Du får dem at se, før du går i gang, og igen når du er færdig.</p>
    <div class="tiles">${tiles}
      <div class="tile wide" style="cursor:default"><div><span class="n">Begreber</span><h3>Begrebstræning</h3><p>${CONCEPTS.length} kernebegreber fra politik, sociologi, økonomi og international politik: definitioner, eksempler og begreber i analyse.</p></div>
      <button class="btn" data-nav="begreber">Træn begreber</button></div></div></section>
  <section class="block"><h2>Sådan virker det</h2>
    <div class="howto"><div><h3>Læs genrekravene</h3><p>Hver quiz starter med opgaveformuleringen og de krav, din besvarelse skal opfylde.</p></div>
      <div><h3>Vælg det bedste svar</h3><p>Spørgsmålene handler om bilagene. Rammer du forkert, får du en forklaring og et hint og kan prøve igen.</p></div>
      <div><h3>Aflever kvitteringen</h3><p>Til sidst ser du, hvilke genrekrav du ramte, og får en kvittering med navn og dato til din lærer.</p></div></div></section>
  <div class="credit"><b>Udviklet af ${AUTHOR}</b><span class="muted">${SCHOOL}</span></div>`;
  bindChrome();
  app.querySelectorAll("[data-nav-g]").forEach(b => b.addEventListener("click", () => go("genre", b.dataset.navG)));
}

/* ---------- Om ---------- */
function renderOm(){
  app.innerHTML = header() + `<article class="prose">
    <div class="label">Om sitet</div><h1>Om Genretræning</h1>
    <p>Genretræning er et øvelsessite til samfundsfag A. Det skal hjælpe dig med at opfylde genrekravene i de seks opgavetyper til den skriftlige prøve: Hvad kan der udledes, Opstil hypoteser, Undersøg, Sammenlign, Diskutér og Skriv et notat.</p>
    <p>Mange besvarelser trækker ned, fordi de ikke gør præcis det, opgaven beder om. Derfor træner du her ikke ved at skrive lange tekster, men ved at vurdere færdige formuleringer: Hvilken indledning rammer fokus? Hvilket afsnit er en egentlig sammenligning? Hvilken begrundelse bruger tallene rigtigt?</p>
    <h2>Sådan bruger du sitet</h2>
    <ul><li>Vælg en genre. Hver genre har quizzer på op til tre niveauer: grundlæggende, sikker og ekspert.</li>
      <li>Læs opgaveformuleringen og genrekravene, før du går i gang. Bilagene står ved siden af spørgsmålene.</li>
      <li>Svarer du forkert, får du at vide hvorfor, og du får et hint. Rigtigt i første forsøg giver 3 point, andet forsøg 2 point og tredje forsøg 1 point.</li>
      <li>Til sidst ser du, hvilke genrekrav du ramte, og får en anbefaling til, hvad du skal træne nu.</li>
      <li>Under Begreber kan du træne fagets kernebegreber på tre niveauer og slå begreber op.</li></ul>
    <h2>Bilag og kilder</h2>
    <p>Alle bilag er autentiske og fra 2020 eller senere. Tallene kommer fra fx Danmarks Statistik, Verdensbanken, Pew Research Center og meningsmålinger, og teksterne fra ministerier, Statsministeriet, partiernes egne tekster, VIVE og internationale organisationer. Avisartikler bruges ikke. Hvert bilag har en kildeangivelse og et link til kilden. Tallene er hentet i oktober 2026. Enkelte bilag er på engelsk.</p>
    <p>Genrekravene bygger på læreplanen og vejledningen til samfundsfag A (2024) og på fagkonsulentens materiale ”Opgavetyper i samfundsfag”.</p>
    <h2>Dine data</h2>
    <p>Dit navn bruges kun på resultatkvitteringen. Navn og resultater gemmes kun i din egen browser og sendes ikke nogen steder hen. Vil du aflevere et resultat, kopierer du kvitteringen eller tager et skærmbillede.</p>
    <h2>Udvikling</h2>
    <p>Genretræning er udviklet af ${AUTHOR}, ${SCHOOL}.</p>
    <p class="ai">Sitet er udviklet med hjælp fra AI (Claude). Bilag, opgaver og forklaringer er udvalgt og kvalitetssikret af ${AUTHOR}.</p>
    </article>` + footer();
  bindChrome();
}

/* ---------- Genreoversigt ---------- */
function renderGenre(){
  const g = G(state.genre);
  const results = store.get("results", {});
  const quizzes = QUIZZES.filter(q => q.genre===g.id);
  const slots = [1,2,3].map(lv => {
    const qs = quizzes.filter(q => q.level===lv);
    if(!qs.length) return `<div class="card soon"><div class="label">${LEVELS[lv]}</div><div class="muted">Quizzen på dette niveau kommer snart.</div></div>`;
    return qs.map(q => {
      const r = results[q.id];
      return `<div class="card"><div class="label">${LEVELS[lv]}</div><h3>${esc(q.title)}</h3>
        <div class="meta">${q.kind==="byg"?`<span class="pill byg">Byg selv</span>`:q.badge?`<span class="pill byg">${esc(q.badge)}</span>`:""}<span class="pill">${esc(q.area)}</span><span>${q.questions.length} ${q.kind==="byg"?"trin":q.columns?"opgaver":"spørgsmål"}</span><span>${q.bilag.filter(b=>b.kind!=="scatter").length} bilag</span></div>
        <div class="row"><button class="btn" data-q="${q.id}">${r?"Tag quizzen igen":"Start quizzen"}</button>
        ${r?`<span class="best">Bedste resultat: ${r.best} af ${r.max} point</span>`:""}</div></div>`;
    }).join("");
  }).join("");
  app.innerHTML = header() + `<section class="genre">
    <div><div class="label gl">Opgavetype ${GORDER.indexOf(g.id)+1} af 6</div><div class="ghead">${glyph(g.id)}<h2>${esc(g.name)}</h2></div><p class="lead">${esc(g.intro)}</p>
      <div class="kravbox"><h3>Genrekrav</h3><ol class="krav">${g.krav.map(k=>`<li>${esc(k[1])}</li>`).join("")}</ol>
      <div class="omfang muted">Vejledende omfang til prøven: ${g.omfang}.</div></div></div>
    <div class="cards"><div class="label">Quizzer</div>${slots}</div></section>` + footer();
  bindChrome();
}

/* ---------- Begreber ---------- */
function eligible(t, c){
  return c.id!==t.id && !(t.g && c.g===t.g) && !(t.x||[]).includes(c.id) && !(c.x||[]).includes(t.id);
}
function distractors(t, n){
  return shuffle(CONCEPTS.filter(c => c.d===t.d && eligible(t,c))).slice(0,n);
}
function low(c){ return c.proper || c.term.startsWith("BNP") ? c.term : c.term.charAt(0).toLowerCase()+c.term.slice(1); }
function phr(c){ return c.exf || low(c); }
function genQuestion(t, kind){
  const ds = distractors(t, 3), disc = discName(t.d);
  if(kind==="A") return { type:"mc", krav:"def", prompt:`Hvad betyder ”${t.term}”?`,
    options:[{t:t.def, ok:true, f:`Eksempel: ${t.ex}`}].concat(ds.map(c=>({t:c.def, f:`Det er definitionen af ${low(c)}.`}))),
    hints:[`Eksempel på ${phr(t)}: ${t.ex}`, `Begrebet hører til ${disc.toLowerCase()}. Find den definition, der passer til eksemplet.`], ex:"" };
  if(kind==="B") return { type:"mc", krav:"genkend", prompt:`Hvilket begreb beskrives her? ”${t.def}”`,
    options:[{t:t.term, ok:true, f:`Eksempel: ${t.ex}`}].concat(ds.map(c=>({t:c.term, f:`${c.term} betyder: ${c.def}`}))),
    hints:[`Eksempel: ${t.ex}`, `Begrebet hører til ${disc.toLowerCase()}.`], ex:"" };
  if(kind==="C") return { type:"mc", krav:"eksempel", prompt:`Hvilken situation er et eksempel på ${phr(t)}?`,
    options:[{t:t.ex, ok:true, f:`${t.term} betyder: ${t.def}`}].concat(ds.map(c=>({t:c.ex, f:`Det er et eksempel på ${phr(c)}.`}))),
    hints:[`${t.term} betyder: ${t.def}`], ex:"" };
  return { type:"mc", krav:"eksempel", prompt:`Hvilket begreb passer bedst til situationen? ”${t.ex}”`,
    options:[{t:t.term, ok:true, f:`${t.term} betyder: ${t.def}`}].concat(ds.map(c=>({t:c.term, f:`${c.term} betyder: ${c.def}`}))),
    hints:[`Begrebet hører til ${disc.toLowerCase()}. Læs definitionerne i begrebslisten, hvis du er i tvivl.`], ex:"" };
}
function startBegreb(level, disc){
  const pool = CONCEPTS.filter(c => disc==="alle" || c.d===disc);
  let questions;
  if(level===3){
    questions = shuffle(CASES.filter(c => disc==="alle" || c.d===disc)).slice(0,8).map(c => ({ type:"mc", krav:"analyse", prompt:c.prompt,
      options:c.options, hints:c.hints.concat(["Læs definitionerne af svarmulighederne, og vælg det begreb, der forklarer casen mest præcist."]), ex:"" }));
  } else {
    const kinds = level===1 ? ["A","B"] : ["C","D"];
    questions = shuffle(pool).slice(0,10).map((t,i) => genQuestion(t, kinds[i%2]));
  }
  const q = { id:`beg-${level}-${disc}`, genre:"beg", level, disc, title:`${discName(disc)}`, area:discName(disc), bilag:[], questions,
    task: level===1 ? "Vælg den definition eller det begreb, der passer. Hver gang du tager øvelsen, får du nye begreber."
        : level===2 ? "Kobl begreberne til konkrete situationer. Hver gang du tager øvelsen, får du nye begreber."
        : "Læs casen, og vælg det begreb, der er mest anvendeligt til at forklare den. Pas på begreber, der kun beskriver mønstret." };
  state.view="quiz"; state.genre="beg"; state.quiz=q;

  render(); window.scrollTo(0,0);
}

function boardHtml(q, run, k){
  const done = q.questions.map((y,j) => ({y, j})).filter(({y,j}) => y.sort && run.qs[j].done && j<=k);
  return `<div class="board" aria-label="${esc(q.boardTitle||"Dit overblik")}"><div class="label">${esc(q.boardTitle||"Dit overblik")}</div><div class="cols">${q.columns.map(c => {
    const cards = done.filter(({y}) => y.col===c.id);
    return `<div class="col"><div class="ch">${esc(c.label)}</div>${cards.map(({y,j}) => `<div class="bc${j===k?" new":""}">${esc(y.short||y.card)}</div>`).join("") || '<div class="bc empty">–</div>'}</div>`; }).join("")}</div></div>`;
}
function shortT(t){ return t.length>60 ? t.slice(0,60).replace(/\s\S*$/,"")+" …" : t; }
function composeHyp(x, s){
  const P = id => x.pieces.find(p=>p.id===id), t = i => s.place[i] ? P(s.place[i]).t : null;
  if(!t(0)) return "Din hypotese bygges op her, efterhånden som du vælger delene.";
  const k = s.place[1] ? P(s.place[1]) : null;
  return t(0) + (k ? (k.nocomma ? " " : ", ") + k.t + (t(2) ? " " + t(2) + "." : " …") : " …");
}
function buildBody(x, s){
  const P = id => x.pieces.find(p=>p.id===id);
  const used = new Set(Object.values(s.place));
  const hyp = x.mode==="hyp";
  const part = hyp ? x.slots.findIndex((_,i) => !s.locked.includes(i)) : -1;
  const slots = x.slots.map((sl,i) => {
    const p = s.place[i] ? P(s.place[i]) : null, lock = s.done || s.locked.includes(i);
    if(hyp){
      const now = i===part, cls = ["slot", p?"filled":"", lock?"locked":"", now?"active":"", (!lock && !now)?"future":""].join(" ").replace(/\s+/g," ").trim();
      return `<div class="${cls}" data-slot="${i}" data-cat="${sl.cat}"><span class="sl">Del ${i+1} · ${esc(sl.label)}</span>${p?`<span class="pt">${esc(p.t)}</span>`:`<span class="ph">${now?"Vælg nedenfor":"Kommer bagefter"}</span>`}</div>`;
    }
    const cls = ["slot", p?"filled":"", lock?"locked":"", (!lock && s.active===i)?"active":""].join(" ").trim();
    return `<div class="${cls}" data-slot="${i}" data-cat="" ${lock?"":'role="button" tabindex="0"'} aria-label="Plads ${i+1}: ${p?esc(p.t):"tomt felt"}${lock&&p?" (rigtigt)":""}">
      <span class="sl">${(i+1)+"."}</span>${p?`<span class="pt">${esc(p.t)}</span>`:`<span class="ph">Tryk på en sætning nedenfor, eller træk den herhen</span>`}</div>`;
  }).join("");
  const ctx = x.context ? `<div class="ctx"><span class="label">Hypotese ${x.hypno}</span>${esc(x.context)}</div>` : "";
  const preview = hyp ? `<div class="preview"><span class="label">Din hypotese</span>${esc(composeHyp(x, s))}</div>` : "";
  const groups = hyp ? (part<0 ? [] : [[x.slots[part].cat, `Del ${part+1}: vælg ${x.slots[part].label.toLowerCase()}`]]) : [[null,"Sætninger"]];
  const bank = s.done ? "" : groups.map(([cat,lab]) => {
    const items = s.order.filter(id => !used.has(id) && (!cat || P(id).cat===cat));
    return `<div class="bank"><div class="label">${lab}</div><div class="pieces">${items.map(id => { const p = P(id), bad = s.bad.includes(id);
      return `<button type="button" class="piece${bad?" bad":""}" data-piece="${id}" data-cat="${p.cat||""}" ${bad?"disabled":""}>${esc(p.t)}${bad?'<span class="sr"> (forkert)</span>':""}</button>`; }).join("") || '<span class="muted" style="font-size:.9rem">Alle er sat ind.</span>'}</div></div>`;
  }).join("");
  const btns = (s.done || hyp) ? "" : `<div class="actions" style="justify-content:flex-start"><button class="btn" id="bcheck" type="button">Tjek</button><button class="btn ghost" id="bclear" type="button">Tøm felterne</button></div>`;
  return `${ctx}<div class="slots ${hyp?"hyp":"begr"}">${slots}</div>${preview}${bank}${btns}`;
}
function refreshPane(q, g, focusSel){
  const qp = $(".qpane"); if(!qp) return render();
  qp.innerHTML = questionHtml(q, g);
  qp.querySelectorAll(".tobilag").forEach(b => b.addEventListener("click", () => { const el = $("#bilag"); if(el){ el.querySelectorAll("details").forEach(d=>d.open=true); el.scrollIntoView({block:"start"}); } }));
  bindQuiz(q, g);
  if(focusSel){ const el = $(focusSel); if(el) el.focus({preventScroll:true}); }
}
function bindBuild(q, g, x, s){
  if(s.done) return;
  const P = id => x.pieces.find(p=>p.id===id), hyp = x.mode==="hyp";
  const free = i => !s.done && !s.locked.includes(i);
  const place = (id, i) => {
    if(i==null || i<0 || !free(i)) return false;
    if(hyp && x.slots[i].cat!==P(id).cat) return false;
    Object.keys(s.place).forEach(k => { if(s.place[k]===id) delete s.place[k]; });
    s.place[i] = id; s.active = null; return true;
  };
  const targetFor = id => {
    if(hyp) return x.slots.findIndex(sl => sl.cat===P(id).cat);
    if(s.active!=null && free(s.active)) return s.active;
    return x.slots.findIndex((sl,i) => free(i) && !s.place[i]);
  };
  let suppress = false;
  const part = hyp ? x.slots.findIndex((_,i) => !s.locked.includes(i)) : -1;
  const partHint = ["Sammenhængen skal kunne aflæses direkte i tabellen og bygge på en tydelig forskel.", "En hypotese forklarer sammenhængen. Hvilket bindeord indleder en forklaring?", null];
  const choose = id => {
    if(part<0) return;
    if(x.slots[part].accept.includes(id)){
      s.place[part] = id; s.locked.push(part);
      if(s.locked.length===x.slots.length){
        s.done = true; s.points = Math.max(0, 3 - s.tries);
        s.msgs = [{c:"ok", t: s.tries===0 ? "Rigtigt i første forsøg." : "Rigtigt.", h: "<em>"+esc(composeHyp(x, s))+"</em><br><br>" + esc(x.ok) + "<br><br>" + esc(x.ex)}];
        render(); focusFeedback(); return;
      }
      const nxt = x.slots[part+1].label.toLowerCase();
      s.msgs = [{c:"ok", t:"Rigtigt.", h:`Videre til del ${part+2}: ${nxt}.`}];
      refreshPane(q, g, ".piece:not([disabled])"); return;
    }
    s.tries++; if(!s.bad.includes(id)) s.bad.push(id);
    const hint = partHint[part] || x.hints[x.hints.length-1];
    s.msgs = [{c:"bad", t:"Ikke det bedste valg.", h: esc(P(id).f)}, {c:"hint", t:"Hint", h: esc(hint)}];
    refreshPane(q, g); focusFeedback();
  };
  app.querySelectorAll(".piece:not([disabled])").forEach(b => {
    const id = b.dataset.piece;
    b.addEventListener("click", () => { if(suppress) return; if(hyp) return choose(id); const i = targetFor(id); if(place(id, i)) refreshPane(q, g, `.slot[data-slot="${i}"]`); });
    b.addEventListener("pointerdown", e => {
      if(e.pointerType!=="mouse" || e.button!==0) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY; let ghost = null;
      const over = ev => { const t = document.elementFromPoint(ev.clientX, ev.clientY); return t && t.closest(".slot[data-slot]"); };
      const move = ev => {
        if(!ghost){ if(Math.hypot(ev.clientX-sx, ev.clientY-sy) < 6) return;
          ghost = b.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width = b.getBoundingClientRect().width+"px"; app.appendChild(ghost); b.classList.add("dragging"); }
        ghost.style.left = (ev.clientX - 24)+"px"; ghost.style.top = (ev.clientY - 18)+"px";
        app.querySelectorAll(".slot.over").forEach(z => z.classList.remove("over"));
        const z = over(ev); if(z && (hyp ? +z.dataset.slot===part : free(+z.dataset.slot))) z.classList.add("over");
      };
      const up = ev => {
        document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up);
        if(!ghost){ b.click(); return; }
        ghost.remove(); b.classList.remove("dragging"); suppress = true; setTimeout(() => { suppress = false; }, 60);
        app.querySelectorAll(".slot.over").forEach(z => z.classList.remove("over"));
        const z = over(ev);
        if(hyp){ if(z && +z.dataset.slot===part) choose(id); return; }
        if(z && place(id, +z.dataset.slot)) refreshPane(q, g);
      };
      document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
    });
  });
  app.querySelectorAll(".slot[role=button]").forEach(el => {
    const i = +el.dataset.slot;
    const act = () => { if(s.place[i]){ delete s.place[i]; s.active = hyp ? null : i; } else s.active = (s.active===i ? null : i); refreshPane(q, g, `.slot[data-slot="${i}"]`); };
    el.addEventListener("click", act);
    el.addEventListener("keydown", e => { if(e.key==="Enter" || e.key===" "){ e.preventDefault(); act(); } });
  });
  const clr = $("#bclear");
  if(clr) clr.addEventListener("click", () => { Object.keys(s.place).forEach(k => { if(free(+k)) delete s.place[k]; }); s.active = null; refreshPane(q, g, "#bclear"); });
  const chk = $("#bcheck");
  if(chk) chk.addEventListener("click", () => {
    if(x.slots.some((_,i) => !s.place[i])){
      s.msgs = [{c:"hint", t:"Fyld alle felter", h: hyp ? "Vælg en sammenhæng, et bindeord og en forklaring, før du tjekker." : "Vælg tre sætninger, før du tjekker."}];
      refreshPane(q, g); focusFeedback(); return;
    }
    const wrong = x.slots.map((_,i) => i).filter(i => !s.locked.includes(i) && !x.slots[i].accept.includes(s.place[i]));
    x.slots.forEach((_,i) => { if(!wrong.includes(i) && !s.locked.includes(i)) s.locked.push(i); });
    if(!wrong.length){
      s.done = true; s.points = Math.max(0, 3 - s.tries);
      s.msgs = [{c:"ok", t: s.tries===0 ? "Rigtigt i første forsøg." : "Rigtigt.", h: (hyp ? "<em>"+esc(composeHyp(x, s))+"</em><br><br>" : "") + esc(x.ok) + "<br><br>" + esc(x.ex)}];
      render(); focusFeedback(); return;
    }
    s.tries++; s.msgs = [];
    wrong.forEach(i => { const id = s.place[i], p = P(id), good = x.slots.some(sl => sl.accept.includes(id));
      if(!good){ s.bad.push(id); s.msgs.push({c:"bad", t:`Ikke rigtigt: ”${esc(shortT(p.t))}”`, h: esc(p.f)}); }
      else s.msgs.push({c:"bad", t:`Forkert plads: ”${esc(shortT(p.t))}”`, h: esc(x.slots[i].f || "Stykket hører til et andet sted.")});
      delete s.place[i]; });
    if(s.tries >= 4){
      x.slots.forEach((sl,i) => { if(!s.locked.includes(i)){ s.place[i] = sl.accept.find(a => !Object.values(s.place).includes(a)); } });
      s.done = true; s.revealed = true; s.points = 0;
      s.msgs.push({c:"hint", t:"Løsning", h: (hyp ? "<em>"+esc(composeHyp(x, s))+"</em><br><br>" : "") + esc(x.ok) + "<br><br>" + esc(x.ex)});
      render(); focusFeedback(); return;
    }
    s.msgs.push({c:"hint", t:`Hint ${Math.min(s.tries, x.hints.length)}`, h: esc(x.hints[Math.min(s.tries, x.hints.length)-1])});
    refreshPane(q, g); focusFeedback();
  });
}

function parseNum(str){
  let t = String(str).trim().replace(/\s/g,"").replace(/[−–]/g,"-").replace(/%$/,"");
  if(!t) return NaN;
  if(t.includes(",")){ t = t.replace(/\./g,"").replace(",","."); }
  else if((t.match(/\./g)||[]).length>1){ t = t.replace(/\./g,""); }
  return Number(t);
}

function bindQuiz(q, g){
  const run = state.run;
  const sf = $("#sf");
  if(sf) sf.addEventListener("submit", e => { e.preventDefault(); const n = $("#nm").value.trim();
    if(!n){ $("#nerr").textContent = "Skriv dit navn, så det kan stå på kvitteringen."; return; }
    run.name = n; store.set("name", n); run.started = true; render(); window.scrollTo(0,0); });
  if(!run.started || run.finished){ if(run.finished) bindResult(q, g); return; }
  const x = q.questions[run.i], s = run.qs[run.i];
  const hintFor = n => x.hints[Math.min(n-1, x.hints.length-1)];
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const oi = +b.dataset.o, o = x.options[oi];
    if(s.done || s.wrong.includes(oi)) return;
    if(o.ok){ s.done = true; s.points = Math.max(0, 3 - s.tries);
      s.msgs = [];
      s.msgs.push({c:"ok", t: s.tries===0 ? "Rigtigt i første forsøg." : "Rigtigt.", h: esc(o.f) + (x.ex? "<br><br>" + esc(x.ex) : "")});
    } else { s.wrong.push(oi); s.tries++;
      s.msgs = s.msgs.filter(m => m.c!=="hint");
      s.msgs.push({c:"bad", t:"Ikke det bedste svar.", h: esc(o.f)});
      s.msgs.push({c:"hint", t:`Hint ${Math.min(s.tries, x.hints.length)}`, h: esc(hintFor(s.tries))});
    }
    render(); focusFeedback();
  }));
  const nf = $("#nf");
  if(nf){ $("#num").focus({preventScroll:true});
    nf.addEventListener("submit", e => { e.preventDefault();
      const v = parseNum($("#num").value);
      if(isNaN(v)){ s.msgs = s.msgs.filter(m=>m.c!=="hint"); s.msgs.push({c:"hint", t:"Skriv et tal", h:"Brug tal og eventuelt komma som decimaltegn, fx 12,5."}); render(); return; }
      if(Math.abs(v - x.answer) <= x.tol){ s.done = true; s.points = Math.max(0, 3 - s.tries);
        s.msgs = s.msgs.filter(m=>m.c!=="hint");
        s.msgs.push({c:"ok", t: s.tries===0 ? "Rigtigt i første forsøg." : "Rigtigt.", h: esc(x.ex)});
      } else {
        const w = (x.wrongs||[]).find(w => Math.abs(v - w.v) <= w.tol);
        s.msgs = s.msgs.filter(m=>m.c!=="hint");
        if(w && w.free){ s.msgs.push({c:"hint", t:"Næsten", h: esc(w.f) + " Det tæller ikke som et forkert forsøg."}); }
        else { s.tries++;
          s.msgs.push({c:"bad", t:`Ikke rigtigt (${fmtInput(v)})`, h: w ? esc(w.f) : "Tjek tallene og regnestykket igen."});
          if(s.tries >= 4){ s.done = true; s.revealed = true; s.points = 0;
            s.msgs.push({c:"hint", t:"Løsning", h: esc(x.ex)}); }
          else s.msgs.push({c:"hint", t:`Hint ${Math.min(s.tries, x.hints.length)}`, h: esc(hintFor(s.tries))});
        }
      }
      render(); focusFeedback();
    });
  }
  if(x.type==="build") bindBuild(q, g, x, s);
  const nx = $("#next");
  if(nx) nx.addEventListener("click", () => {
    if(run.i < q.questions.length-1){ run.i++; render(); $(".qpane").scrollIntoView({block:"start"}); const pr=$(".prompt"); if(pr){ pr.setAttribute("tabindex","-1"); pr.focus({preventScroll:true}); } }
    else finish(q);
  });
}
function fmtInput(v){ return Number.isInteger(v) ? v.toLocaleString("da-DK") : v.toLocaleString("da-DK",{maximumFractionDigits:4}); }
function focusFeedback(){ const f = $("#fbnow"); if(f){ f.focus({preventScroll:true}); f.scrollIntoView({block:"nearest", behavior:"smooth"}); } else { const n = $("#next"); if(n) n.focus(); } }

function finish(q){
  const run = state.run; run.finished = true; run.endedAt = new Date();
  const pts = run.qs.reduce((a,s)=>a+s.points,0), max = q.questions.length*3;
  const res = store.get("results", {}); const prev = res[q.id];
  res[q.id] = { best: Math.max(pts, prev? prev.best : 0), max, last: pts };
  store.set("results", res);
  render(); window.scrollTo(0,0);
}

function recommendation(q, pct){
  if(q.genre==="beg"){
    if(pct >= .8 && q.level < 3) return `Flot. Du er klar til næste niveau.<div class="actions" style="justify-content:flex-start"><button class="btn" data-b="${q.level+1}:${q.disc}">${BLEVELS[q.level+1]}</button></div>`;
    if(pct >= .8) return `Flot. Prøv en anden disciplin, eller brug begreberne i en genrequiz.<div class="actions" style="justify-content:flex-start"><button class="btn ghost" data-nav="genre">Træn en genre</button></div>`;
    return `${pct>=.5 ? "Godt på vej." : "Læs begreberne igen i begrebslisten."} Tag øvelsen igen. Du får nye spørgsmål hver gang.${q.level>1 && pct<.5 ? `<div class="actions" style="justify-content:flex-start"><button class="btn ghost" data-b="${q.level-1}:${q.disc}">${BLEVELS[q.level-1]}</button></div>`:""}`;
  }
  const same = QUIZZES.filter(x => x.genre===q.genre && x.id!==q.id);
  let target, msg;
  if(pct >= .8 && q.level >= 3){ target = 3; msg = "Flot. Du klarer ekspertniveauet i denne genre. Prøv ekspertniveauet i en anden genre."; }
  else if(pct >= .8){ target = q.level+1; msg = "Flot. Du er klar til et sværere niveau."; }
  else if(pct >= .5){ target = q.level; msg = "Godt på vej. Træn videre på samme niveau, og læs genrekravene igen inden næste quiz."; }
  else { target = Math.max(1, q.level-1); msg = "Læs genrekravene og forklaringerne igen. Prøv derefter quizzen igen, eller tag en lettere quiz."; }
  const done = store.get("results",{});
  const btn = (x, cls) => `<div class="actions" style="justify-content:flex-start"><button class="btn${cls?" "+cls:""}" data-q="${x.id}" data-g="${x.genre}">${x.genre!==q.genre ? esc(G(x.genre).tab)+": " : ""}${esc(x.title)} (${LEVELS[x.level]})</button></div>`;
  const atTarget = same.filter(x => x.level===target);
  const fresh = same.filter(x => !done[x.id]);
  const near = fresh.filter(x => pct >= .8 ? x.level >= q.level : x.level <= q.level)
    .sort((a,b) => Math.abs(a.level-target) - Math.abs(b.level-target) || (pct >= .8 ? b.level-a.level : a.level-b.level))[0];
  if(pct >= .8 && q.level >= 3){ const x3 = QUIZZES.find(x => x.genre!==q.genre && x.level===3 && !done[x.id]) || QUIZZES.find(x => x.genre!==q.genre && x.level===3);
    return msg + (x3 ? btn(x3) : ""); }
  const next = atTarget.find(x => !done[x.id]) || near;
  if(next && next.level===target) return msg + btn(next);
  if(next) return (pct >= .5 ? "Godt på vej. " : "Læs genrekravene og forklaringerne igen. ") + (next.level < target
      ? "Du har prøvet de nye quizzer på dette niveau i genren, så styrk grundlaget med en quiz på et lettere niveau:"
      : "Du har prøvet de nye quizzer på dette niveau i genren, så prøv en quiz på et sværere niveau:") + btn(next);
  const other = QUIZZES.find(x => x.genre!==q.genre && !done[x.id]);
  return `${msg} Du har prøvet de relevante quizzer i denne genre. Tag en af dem igen, eller træn en anden genre.` + (other ? btn(other, "ghost") : "");
}

    <div class="score"><span class="big">${pts}<span class="muted" style="font-size:1.2rem"> / ${max}</span></span><span>${Math.round(pct*100)} % · ${first} af ${q.questions.length} rigtige i første forsøg</span></div>
    <div style="margin:12px 0 0">${recommendation(q, pct)}</div></div>
    <div class="panel"><h3 style="font-size:1.1rem">${beg ? "Det trænede du" : "Genrekravene i "+esc(g.name.toLowerCase())+": det trænede du"}</h3><ul class="status">${status}</ul>
    ${beg?"":`<div class="omfang muted">Vejledende omfang til prøven: ${g.omfang}.</div>`}</div>
    <div class="panel"><h3 style="font-size:1.1rem">Resultatkvittering</h3>
    <p class="muted" style="margin:4px 0 0">Kopiér kvitteringen, eller tag et skærmbillede, og aflever den, som din lærer har bedt om.</p>
    <pre class="receipt" id="rc">${esc(receipt)}</pre>
    <div class="actions" style="justify-content:flex-start"><button class="btn" id="copy">Kopiér kvittering</button><span id="cmsg" class="muted" aria-live="polite"></span></div></div>
    <div class="actions" style="justify-content:flex-start"><button class="btn ghost" id="again">${beg?"Tag øvelsen igen":"Tag quizzen igen"}</button></div>`;

/* ---------- Diagrammer ---------- */
function regression(pts){
  const n = pts.length, mx = pts.reduce((a,p)=>a+p[1],0)/n, my = pts.reduce((a,p)=>a+p[2],0)/n;
  const b = pts.reduce((a,p)=>a+(p[1]-mx)*(p[2]-my),0)/pts.reduce((a,p)=>a+(p[1]-mx)**2,0), a0 = my - b*mx;
  const ss = pts.reduce((a,p)=>a+(p[2]-my)**2,0), res = pts.reduce((a,p)=>a+(p[2]-(a0+b*p[1]))**2,0);
  return {b, a:a0, r2: 1-res/ss};
}
function niceStep(range){ const r = range/6, p = Math.pow(10, Math.floor(Math.log10(r))); return [1,2,2.5,5,10].map(m=>m*p).find(v=>v>=r); }
function scatterSvg(b){
  const W=720, H=470, L=74, R=24, T=46, B=62;
  const pts = b.data;
  const xs = pts.map(p=>p[1]), ys = pts.map(p=>p[2]);
  const pad = (mn,mx) => { const d=(mx-mn)||1; return [mn-d*.08, mx+d*.08]; };
  let [x0,x1] = b.x ? b.x : pad(Math.min(...xs), Math.max(...xs));
  let [y0,y1] = b.y ? b.y : pad(Math.min(...ys), Math.max(...ys));
  const xs1 = b.xStep || niceStep(x1-x0), ys1 = b.yStep || niceStep(y1-y0);
  x0 = Math.floor(x0/xs1)*xs1; x1 = Math.ceil(x1/xs1)*xs1; y0 = Math.floor(y0/ys1)*ys1; y1 = Math.ceil(y1/ys1)*ys1;
  const X = v => L + (v-x0)/(x1-x0)*(W-L-R), Y = v => H-B - (v-y0)/(y1-y0)*(H-T-B);
  const reg = regression(pts);
  const dec = s => { const t = String(s); return t.includes(".") ? t.split(".")[1].length : 0; };
  const fx = v => v.toLocaleString("da-DK",{maximumFractionDigits:dec(xs1)}), fy = v => v.toLocaleString("da-DK",{maximumFractionDigits:dec(ys1)});
  let g = "";
  for(let v=x0; v<=x1+1e-9; v+=xs1) g += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}"/><text x="${X(v)}" y="${H-B+20}" text-anchor="middle" font-size="13">${fx(v)}</text>`;
  for(let v=y0; v<=y1+1e-9; v+=ys1) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="13">${fy(v)}</text>`;
  const lx0 = Math.min(...xs), lx1 = Math.max(...xs);
  g += `<line x1="${X(lx0)}" y1="${Y(reg.a+reg.b*lx0)}" x2="${X(lx1)}" y2="${Y(reg.a+reg.b*lx1)}" stroke="var(--c2)" stroke-width="2" stroke-dasharray="6 4"/>`;
  const show = b.labels==="none" ? [] : Array.isArray(b.labels) ? b.labels : pts.map(p=>p[0]);
  pts.forEach(([n,x,y]) => { const o = (b.offsets||{})[n] || [8,4,"start"];
    g += `<circle cx="${X(x)}" cy="${Y(y)}" r="5.5" fill="var(--c1)"><title>${esc(n)}: ${x.toLocaleString("da-DK")}; ${y.toLocaleString("da-DK")}</title></circle>`;
    if(show.includes(n)) g += `<text x="${X(x)+o[0]}" y="${Y(y)+o[1]}" text-anchor="${o[2]}" font-size="12.5">${esc(n)}</text>`; });
  const sign = reg.a < 0 ? "−" : "+";
  const eq = b.eqAt || [ (x0+x1)/2 + (x1-x0)*.2, y0 + (y1-y0)*.12 ];
  const dB = b.decB==null ? 2 : b.decB, dA = b.decA==null ? 1 : b.decA;
  g += `<text x="${L}" y="24" font-size="15" font-weight="700">${esc(b.chartTitle)}</text>`;
  g += `<text x="${X(eq[0])}" y="${Y(eq[1])}" font-size="14" style="fill:var(--c2)">y = ${fmt(reg.b,dB)}x ${sign} ${fmt(Math.abs(reg.a),dA)}</text>`;
  g += `<text x="${X(eq[0])}" y="${Y(eq[1])+20}" font-size="14" style="fill:var(--c2)">R² = ${fmt(reg.r2,2)}</text>`;
  g += `<text x="${(L+W-R)/2}" y="${H-14}" text-anchor="middle" font-size="13">${esc(b.xLabel)}</text>`;
  g += `<text transform="translate(18 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="13">${esc(b.yLabel)}</text>`;
  g += `<line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/>`;
  return `<div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Punktdiagram med tendenslinje">${g}</svg></div>`;
}
function indexSvg(){
  const W=760, H=440, L=56, R=205, T=46, B=50;
  const yrs = INDEX_SERIES.years, y0=95, y1=155;
  const X = i => L + i/(yrs.length-1)*(W-L-R), Y = v => H-B - (v-y0)/(y1-y0)*(H-T-B);
  const cols = ["var(--c1)","var(--c5)","var(--c2)","var(--c3)","var(--c4)"];
  let g = `<text x="${L}" y="24" font-size="15" font-weight="700">Lønmodtagere fordelt på herkomst. Indeks (2020 = 100). 2020–2025</text>`;
  for(let v=100; v<=150; v+=10) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="13">${v}</text>`;
  yrs.forEach((yr,i) => g += `<text x="${X(i)}" y="${H-B+20}" text-anchor="middle" font-size="13">${yr}</text>`);
  const ends = INDEX_SERIES.series.map(([n,v],si) => ({n, si, idx: v.map(x=>x/v[0]*100)}));
  ends.forEach(({si,idx}) => {
    g += `<polyline fill="none" stroke="${cols[si]}" stroke-width="2.5" points="${idx.map((v,i)=>`${X(i)},${Y(v)}`).join(" ")}"/>`;
    g += `<circle cx="${X(idx.length-1)}" cy="${Y(idx[idx.length-1])}" r="4" fill="${cols[si]}"/>`;
  });
  const lab = ends.map(e=>({...e, y: Y(e.idx[e.idx.length-1])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<lab.length;i++) if(lab[i].y - lab[i-1].y < 30) lab[i].y = lab[i-1].y + 30;
  lab.forEach(e => { g += `<text x="${W-R+10}" y="${e.y-2}" font-size="12.5" style="fill:${cols[e.si]}" font-weight="700">${fmt(e.idx[e.idx.length-1],1)}</text><text x="${W-R+10}" y="${e.y+12}" font-size="11.5">${e.n}</text>`; });
  g += `<text transform="translate(16 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="13">Indeks (2020 = 100)</text>`;
  g += `<line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/>`;
  return `<div class="label" style="margin-bottom:6px">Sådan kunne diagrammet se ud</div><div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurvediagram over indekstal">${g}</svg></div><div class="src">Kilde: Beregnet ud fra tabel 1.</div>`;
}

try{ document.documentElement.lang = "da"; }catch(e){}
routeFromHash();
render();
